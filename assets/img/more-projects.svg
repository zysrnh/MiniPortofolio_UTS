<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Solid Background -->
  <rect width="800" height="500" fill="#1C1917" />

  <!-- Subtle Minimal Grid Lines (Flat Solid) -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#2E2824" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="440" x2="740" y2="440" stroke="#2E2824" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="60" y1="60" x2="60" y2="440" stroke="#2E2824" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="740" y1="60" x2="740" y2="440" stroke="#2E2824" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Crosshair Accents -->
  <path d="M52 60 H68 M60 52 V68" stroke="#881337" stroke-width="2" />
  <path d="M732 60 H748 M740 52 V68" stroke="#881337" stroke-width="2" />
  <path d="M52 440 H68 M60 432 V448" stroke="#881337" stroke-width="2" />
  <path d="M732 440 H748 M740 432 V448" stroke="#881337" stroke-width="2" />

  <!-- Center Content Group -->
  <g transform="translate(400, 250)" text-anchor="middle">
    <!-- Small Category Badge -->
    <rect x="-105" y="-120" width="210" height="32" rx="0" fill="#881337" />
    <text x="0" y="-99" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="2">ALL PROJECTS ARCHIVE</text>

    <!-- Main Headline -->
    <text x="0" y="-20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFDF9" letter-spacing="-0.5">
      Dan Masih Banyak Lagi...
    </text>

    <!-- Subtitle -->
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#B8ADA2" letter-spacing="0.2">
      Jelajahi seluruh koleksi proyek web, sistem &amp; studi kasus
    </text>

    <!-- Action Pill Button -->
    <g transform="translate(0, 75)">
      <rect x="-115" y="-20" width="230" height="40" fill="#2E2824" stroke="#881337" stroke-width="1.5" />
      <text x="-12" y="5" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFDF9" letter-spacing="1.5">LIHAT SEMUA</text>
      <!-- Arrow Icon -->
      <path d="M62 0 L52 -6 M62 0 L52 6 M42 0 H62" stroke="#FFFDF9" stroke-width="2" stroke-linecap="square" />
    </g>
  </g>
</svg>
